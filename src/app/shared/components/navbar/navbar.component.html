<header class="app-navbar" role="banner">
  <div class="app-navbar-inner">
    <!-- Brand -->
    <a class="app-brand" [routerLink]="['/home']">
      <span class="app-brand-mark" aria-hidden="true"></span>
      <span class="app-brand-text">Sendit</span>
    </a>

    <div class="app-navbar-right">
      <a class="app-logout-quick" href="#" role="button" (click)="logout()">
        Logout
      </a>

      <div class="app-user">
        <button
          class="app-user-trigger"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          type="button"
          aria-haspopup="menu"
        >
          <img
            [src]="userAuth.avatar.url"
            class="app-user-avatar"
            [alt]="'Avatar of ' + userAuth.username"
          />
          <span class="app-user-name">{{ userAuth.username }}</span>
          <span class="app-user-chevron" aria-hidden="true">▾</span>
        </button>

        <ul class="app-user-menu dropdown-menu dropdown-menu-end user-dropdown">
          <li>
            <a class="dropdown-item" [routerLink]="['/settings']">
              Account Settings
            </a>
          </li>
          <li><hr class="dropdown-divider" /></li>
          <li>
            <a
              class="dropdown-item text-danger"
              role="button"
              (click)="logout()"
            >
              Log out
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</header>
