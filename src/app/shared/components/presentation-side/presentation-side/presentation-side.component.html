<!-- Presentación cuando no hay chat seleccionado -->
<div class="presentation-shell">
  <div class="presentation-inner">
    <div class="presentation-illustration-wrap">
      <img
        src="../../../../../assets/images/chatting-illustration.png"
        class="presentation-illustration"
        alt="Two friends chatting"
      />
    </div>

    <h2 class="presentation-title">Text with your friends.</h2>
    <p class="presentation-subtitle">
      Select a chat from the sidebar or start a new one.
    </p>

    <button
      type="button"
      class="presentation-cta"
      data-bs-toggle="modal"
      data-bs-target="#inviteModal2"
      (click)="setInviteDuo()"
    >
      <span>Create chat</span>
      <span class="presentation-cta-arrow" aria-hidden="true">→</span>
    </button>
  </div>
</div>

<!-- Modal: nueva conversación -->
<div
  class="modal fade"
  id="inviteModal2"
  tabindex="-1"
  aria-labelledby="inviteModal2Label"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="inviteModal2Label">New conversation</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body text-center">
        <app-invite-modal-body
          [inviteType]="inviteType"
        ></app-invite-modal-body>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
