<div class="user-list">
  <div class="user-list-counter-row">
    <span class="user-list-counter">
      Users found: <strong>{{ users.length }}</strong>
    </span>
  </div>

  <ng-container *ngFor="let user of users">
    <div class="user-list-item">
      <!-- Avatar -->
      <div class="user-list-avatar-wrap">
        <img
          [src]="user.avatar.url"
          class="user-list-avatar"
          [alt]="'Avatar of ' + user.username"
        />
      </div>

      <div class="user-list-info">
        <h6 class="user-list-name">{{ user.username }}</h6>
        <small class="user-list-meta">
          Last seen: {{ stringAsDate(user.createdAt) | date: "shortDate" }}
        </small>
      </div>

      <button
        type="button"
        class="user-list-action"
        (click)="sendRequest(user)"
        [title]="'Send request to ' + user.username"
        [attr.aria-label]="'Send request to ' + user.username"
      >
        Send request
      </button>
    </div>
  </ng-container>
</div>
