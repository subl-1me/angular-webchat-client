<div
  class="box skeleton"
  role="status"
  aria-busy="true"
  aria-label="Loading chats"
>
  <span class="visually-hidden">Loading chats...</span>

  <div class="row skeleton-row p-3 g-2">
    <!-- Avatar skeleton -->
    <div class="col-xxl-2 col-xl-3 col-lg-4 col-12 skeleton-left">
      <div class="skeleton-circle"></div>
    </div>

    <!-- Textos skeleton -->
    <div
      class="col-xxl-7 col-xl-6 col-lg-6 col-12 mt-auto mb-auto skeleton-right"
    >
      <div class="skeleton-line w-50 mb-2"></div>
      <div class="skeleton-line w-25"></div>
    </div>

    <!-- Badge skeleton -->
    <div
      class="col-xxl-2 col-xl-2 col-lg-12 col-12 mt-auto mb-auto text-center ms-auto skeleton-badge-col"
    >
      <div class="skeleton-badge"></div>
    </div>
  </div>
</div>
