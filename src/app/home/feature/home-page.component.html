<div class="app-page">
  <app-navbar></app-navbar>

  <div class="home-shell">
    <aside class="sidebar">
      <header class="sidebar-header">
        <button
          type="button"
          class="btn-pill btn-primary-pill"
          data-bs-toggle="modal"
          data-bs-target="#inviteModal"
          (click)="setInviteType()"
        >
          <fa-icon
            [icon]="faPlus"
            class="btn-icon"
            aria-hidden="true"
          ></fa-icon>
          New conversation
        </button>

        <button
          type="button"
          class="btn-pill btn-ghost-pill"
          (click)="toggleRequestsList()"
          *ngIf="!toggleRequest"
        >
          <fa-icon
            [icon]="faList"
            class="btn-icon"
            aria-hidden="true"
          ></fa-icon>
          Requests
          <span class="pill-badge" role="status">{{ requests.length }}</span>
        </button>

        <button
          type="button"
          class="btn-pill btn-ghost-pill"
          (click)="toggleRequestsList()"
          *ngIf="toggleRequest"
        >
          <fa-icon
            [icon]="faMessage"
            class="btn-icon"
            aria-hidden="true"
          ></fa-icon>
          Conversations
        </button>
      </header>

      <div class="sidebar-body">
        <app-chat-list
          *ngIf="!toggleRequest"
          (selectedChat)="openChat($event)"
          [removedChatId]="removedChatId"
        ></app-chat-list>

        <app-request-list
          *ngIf="toggleRequest"
          [requests]="requests"
        ></app-request-list>
      </div>
    </aside>

    <main class="main-area">
      <app-chat
        [selectedChat]="selectedChat"
        (removedChatId)="removedChatEvent($event)"
        *ngIf="selectedChat._id !== '' && selectedChat._id !== null"
      ></app-chat>

      <app-presentation-side
        *ngIf="selectedChat._id === '' || selectedChat._id === null"
      ></app-presentation-side>
    </main>
  </div>

  <div class="mobile-view d-none">
    <header class="sidebar-header">
      <button
        type="button"
        class="btn-pill btn-primary-pill"
        data-bs-toggle="modal"
        data-bs-target="#inviteModal"
        (click)="setInviteType()"
      >
        <fa-icon [icon]="faPlus" class="btn-icon" aria-hidden="true"></fa-icon>
        New conversation
      </button>

      <button
        type="button"
        class="btn-pill btn-ghost-pill"
        (click)="toggleRequestsList()"
        *ngIf="!toggleRequest"
      >
        <fa-icon [icon]="faList" class="btn-icon" aria-hidden="true"></fa-icon>
        Requests
        <span class="pill-badge" role="status">{{ requests.length }}</span>
      </button>

      <button
        type="button"
        class="btn-pill btn-ghost-pill"
        (click)="toggleRequestsList()"
        *ngIf="toggleRequest"
      >
        <fa-icon
          [icon]="faMessage"
          class="btn-icon"
          aria-hidden="true"
        ></fa-icon>
        Conversations
      </button>
    </header>

    <div class="sidebar-body">
      <app-chat-list
        *ngIf="!toggleRequest"
        (selectedChat)="openChat($event)"
        [removedChatId]="removedChatId"
      ></app-chat-list>

      <app-request-list
        *ngIf="toggleRequest"
        [requests]="requests"
      ></app-request-list>
    </div>

    <div class="mobile-chat-area">
      <app-chat
        [selectedChat]="selectedChat"
        (removedChatId)="removedChatEvent($event)"
        *ngIf="selectedChat._id !== '' || selectedChat._id !== null"
      ></app-chat>

      <app-presentation-side
        *ngIf="selectedChat._id === '' || selectedChat._id === null"
      ></app-presentation-side>
    </div>
  </div>

  <nav class="mobile-bar" aria-label="Bottom navigation">
    <ul class="mobile-bar-nav">
      <li>
        <a
          class="mobile-bar-link"
          href="#"
          role="button"
          data-bs-toggle="modal"
          data-bs-target="#chatListModal"
        >
          <fa-icon [icon]="faMessage" aria-hidden="true"></fa-icon>
          <span>Chats</span>
        </a>
      </li>
      <li>
        <a
          class="mobile-bar-link"
          href="#"
          role="button"
          data-bs-toggle="modal"
          data-bs-target="#requestListModal"
        >
          <span class="icon-wrap">
            <fa-icon [icon]="faList" aria-hidden="true"></fa-icon>
            <span class="pill-badge" *ngIf="requests.length > 0" role="status">
              {{ requests.length }}
            </span>
          </span>
          <span>Requests</span>
        </a>
      </li>
      <li>
        <a class="mobile-bar-link" [routerLink]="['/settings']">
          <fa-icon [icon]="faUser" aria-hidden="true"></fa-icon>
          <span>Account</span>
        </a>
      </li>
    </ul>
  </nav>

  <div
    class="modal fade"
    id="chatListModal"
    tabindex="-1"
    aria-labelledby="chatListModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="chatListModalLabel">Chats</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body text-center">
          <app-chat-list
            (selectedChat)="openChat($event)"
            [removedChatId]="removedChatId"
          ></app-chat-list>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <div
    class="modal fade"
    id="requestListModal"
    tabindex="-1"
    aria-labelledby="requestListModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="requestListModalLabel">Requests</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body text-center">
          <app-request-list
            (updatedRequestList)="refreshRequestList($event)"
            [requests]="requests"
          ></app-request-list>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <div
    class="modal fade"
    id="inviteModal"
    tabindex="-1"
    aria-labelledby="inviteModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="inviteModalLabel">New conversation</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body text-center">
          <app-invite-modal-body
            [inviteType]="inviteType"
          ></app-invite-modal-body>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
