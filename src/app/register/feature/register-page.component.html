<div class="register-page">
  <section class="register-brand">
    <div class="brand-content">
      <div class="brand-logo">
        <span class="logo-mark"></span>
        <span class="logo-text">Sendit</span>
      </div>

      <img
        src="../../../assets/images/connect-presentation.svg"
        class="brand-illustration"
        alt="Illustration of two people connecting through chat"
      />

      <h1 class="brand-title">
        Welcome to Sendit<span class="brand-dot">.</span>
      </h1>
      <p class="brand-subtitle">
        Connect with your friends and text with <b>privacy</b>.
      </p>

      <ul class="brand-features">
        <li>
          <span class="feature-dot"></span>
          End-to-end conversations
        </li>
        <li>
          <span class="feature-dot"></span>
          Real-time messaging
        </li>
        <li>
          <span class="feature-dot"></span>
          Group chats &amp; invites
        </li>
        <li>
          <span class="feature-dot"></span>
          Free, forever
        </li>
      </ul>
    </div>

    <span class="deco deco-1"></span>
    <span class="deco deco-2"></span>
    <span class="deco deco-3"></span>
  </section>

  <section class="register-form-panel">
    <div class="register-card">
      <header class="register-card-header">
        <h2 class="register-title">Create your account</h2>
        <p class="register-desc">Join Sendit and start chatting in seconds.</p>
      </header>

      <form
        [formGroup]="registerForm"
        (ngSubmit)="register()"
        novalidate
        class="register-form"
      >
        <!-- Username -->
        <div class="field">
          <label for="register-username" class="field-label">Username</label>
          <div class="field-control">
            <input
              id="register-username"
              type="text"
              formControlName="username"
              class="field-input"
              placeholder="e.g. johndoe"
              autocomplete="username"
              aria-label="Username"
            />
          </div>
        </div>

        <!-- Email -->
        <div class="field">
          <label for="register-email" class="field-label">Email</label>
          <div class="field-control">
            <input
              id="register-email"
              type="email"
              formControlName="email"
              class="field-input"
              placeholder="you@example.com"
              autocomplete="email"
              aria-label="Email"
            />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="register-password" class="field-label">Password</label>
            <div class="field-control">
              <input
                id="register-password"
                type="password"
                formControlName="password"
                class="field-input"
                placeholder="At least 8 chars"
                autocomplete="new-password"
                aria-label="Password"
              />
            </div>
          </div>

          <div class="field">
            <label for="register-confirm-password" class="field-label">
              Confirm password
            </label>
            <div class="field-control">
              <input
                id="register-confirm-password"
                type="password"
                formControlName="confirmPassword"
                class="field-input"
                placeholder="Repeat password"
                autocomplete="new-password"
                aria-label="Confirm your password"
              />
            </div>
          </div>
        </div>

        <button
          type="button"
          class="btn-submit"
          (click)="register()"
          *ngIf="!isFormLoading"
        >
          Create account
        </button>

        <button
          type="button"
          class="btn-submit btn-loading"
          *ngIf="isFormLoading"
          disabled
        >
          <span class="spinner" role="status" aria-hidden="true"></span>
          <span class="visually-hidden">Creating...</span>
          <span>Creating...</span>
        </button>

        <p
          id="serviceErrorMessage"
          *ngIf="serviceErrorMessage !== ''"
          class="form-error"
          role="alert"
        >
          {{ serviceErrorMessage }}
        </p>
      </form>

      <div class="register-divider">
        <span>Already registered?</span>
      </div>

      <a class="btn-secondary" [routerLink]="['/login']">Log in</a>
    </div>
  </section>
</div>
