<div class="login-page">
  <!-- ============================================================
       Panel de marca (izquierda)
       ============================================================ -->
  <section class="login-brand">
    <div class="brand-content">
      <div class="brand-logo">
        <span class="logo-mark"></span>
        <span class="logo-text">Sendit</span>
      </div>

      <img
        src="../../../assets/images/connect-presentation.svg"
        class="brand-illustration"
        alt="Illustration of two people connecting through chat"
      />

      <h1 class="brand-title">Welcome back<span class="brand-dot">.</span></h1>
      <p class="brand-subtitle">
        Connect with your friends and text with <b>privacy</b>.
      </p>

      <ul class="brand-features">
        <li>
          <span class="feature-dot"></span>
          End-to-end conversations
        </li>
        <li>
          <span class="feature-dot"></span>
          Real-time messaging
        </li>
        <li>
          <span class="feature-dot"></span>
          Group chats &amp; invites
        </li>
      </ul>
    </div>

    <!-- Burbujas decorativas (puro CSS) -->
    <span class="deco deco-1"></span>
    <span class="deco deco-2"></span>
    <span class="deco deco-3"></span>
  </section>

  <!-- ============================================================
       Panel del formulario (derecha)
       ============================================================ -->
  <section class="login-form-panel">
    <div class="login-card">
      <header class="login-card-header">
        <h2 class="login-title">Log in</h2>
        <p class="login-desc">Enter your credentials to continue.</p>
      </header>

      <form
        [formGroup]="loginForm"
        (ngSubmit)="login()"
        novalidate
        class="login-form"
      >
        <!-- Username -->
        <div class="field">
          <label for="login-username" class="field-label">Username</label>
          <div class="field-control">
            <input
              id="login-username"
              type="text"
              formControlName="username"
              class="field-input"
              placeholder="e.g. johndoe"
              autocomplete="username"
              aria-label="Username"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="login-password" class="field-label">Password</label>
          <div class="field-control">
            <input
              id="login-password"
              type="password"
              formControlName="password"
              class="field-input"
              placeholder="••••••••"
              autocomplete="current-password"
              aria-label="Password"
            />
          </div>
        </div>

        <!-- Botón Login (normal) -->
        <button
          type="submit"
          class="btn-submit"
          (click)="login()"
          *ngIf="!isFormLoading"
        >
          Log in
        </button>

        <!-- Botón Login (loading) -->
        <button
          type="button"
          class="btn-submit btn-loading"
          *ngIf="isFormLoading"
          disabled
        >
          <span class="spinner" role="status" aria-hidden="true"></span>
          <span class="visually-hidden">Loading...</span>
          <span>Loading...</span>
        </button>

        <!-- Error -->
        <p
          id="serviceErrorMessage"
          *ngIf="serviceErrorMessage !== ''"
          class="form-error"
          role="alert"
        >
          {{ serviceErrorMessage }}
        </p>
      </form>

      <div class="login-divider">
        <span>New here?</span>
      </div>

      <a class="btn-secondary" [routerLink]="['/register']">
        Create an account
      </a>
    </div>
  </section>
</div>
